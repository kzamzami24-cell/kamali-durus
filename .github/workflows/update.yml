name: تحديث فهرس الدروس

on:
  schedule:
    - cron: '17 3,15 * * *'   # مرتان يوميًا (6:17 صباحًا و6:17 مساءً بتوقيت مكة)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-catalog
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: تثبيت yt-dlp
        run: pip install --upgrade yt-dlp
      - name: جلب القوائم من يوتيوب
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
        run: python scripts/fetch.py
      - name: بناء الفهرس
        run: python scripts/build.py
      - name: حفظ التغييرات
        run: |
          if git diff --quiet -- catalog.json data/raw.json; then
            echo "لا جديد"; exit 0
          fi
          git config user.name "kamali-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog.json data/raw.json
          git commit -m "تحديث تلقائي لفهرس الدروس"
          git push
